    <script>
      // Motion runs only with scripting on and motion allowed. If the app never signals
      // it is ready, the hidden-until-animated states are released after 4s.
      (function () {
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var d = document.documentElement;
        d.classList.add("js");
        setTimeout(function () { if (!window.__motionReady) d.classList.remove("js"); }, 4000);
      })();
    </script>
